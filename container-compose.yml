# Rootless Podman containers for Fireboy & Watergirl Co-op
# All bind to localhost only, Alpine-based, with persistent volumes

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: fw-postgres
    user: "1000:1000"
    environment:
      POSTGRES_USER: fwuser
      POSTGRES_PASSWORD: ${PG_PASSWORD:-fw_dev_password_change_me}
      POSTGRES_DB: fireboycoop
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - ./container-data/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fwuser -d fireboycoop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: fw-valkey
    user: "1000:1000"
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --requirepass ${VALKEY_PASSWORD:-fw_dev_password_change_me}
      --save 900 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:54323:6379"
    volumes:
      - ./container-data/valkey:/data:Z
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coturn:
    image: docker.io/coturn/coturn:4.6-alpine
    container_name: fw-coturn
    network_mode: host
    command: >
      turnserver
      --log-file=stdout
      --lt-cred-mech
      --realm=${TURN_REALM:-fireboy-coop.alpeerkaraca.me}
      --user=${TURN_USERNAME:-fw-turn}:${TURN_PASSWORD:-fw_turn_password_change_me}
      --external-ip=${TURN_EXTERNAL_IP}
      --listening-port=3478
      --tls-listening-port=5349
      --cert=/etc/coturn/fullchain.pem
      --pkey=/etc/coturn/privkey.pem
      --no-multicast-peers
      --no-cli
    volumes:
      - /etc/letsencrypt/live/${TURN_DOMAIN:-turn.alpeerkaraca.me}/fullchain.pem:/etc/coturn/fullchain.pem:ro
      - /etc/letsencrypt/live/${TURN_DOMAIN:-turn.alpeerkaraca.me}/privkey.pem:/etc/coturn/privkey.pem:ro
    restart: unless-stopped
