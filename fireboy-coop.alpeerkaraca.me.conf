# Nginx configuration for Fireboy & Watergirl Co-op
# Domain: fireboy-coop.alpeerkaraca.me
# Backend: Express on localhost:3000, gRPC on localhost:50051

upstream fw_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream fw_grpc {
    server 127.0.0.1:50051;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=fw_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fw_api:10m rate=60r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fireboy-coop.alpeerkaraca.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fireboy-coop.alpeerkaraca.me;

    # SSL
    ssl_certificate     /etc/nginx/ssl/fireboy-coop.alpeerkaraca.me.pem;
    ssl_certificate_key /etc/nginx/ssl/fireboy-coop.alpeerkaraca.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_comp_level 5;
    gzip_min_length 256;

    # Root for static files (served by Express, but Nginx can cache)
    root /var/www/fireboy-coop;

    # Long-term caching for immutable assets
    location ~* \.(wasm|swf)$ {
        proxy_pass http://fw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets with short cache
    location ~* \.(js|css|png|jpg|svg|ico|xml|json|mp3|wav|ttf)$ {
        proxy_pass http://fw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://fw_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Auth endpoints — strict rate limit
    location /api/auth/ {
        proxy_pass http://fw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=fw_auth burst=3 nodelay;
    }

    # API endpoints — moderate rate limit
    location /api/ {
        proxy_pass http://fw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=fw_api burst=20 nodelay;
    }

    # gRPC passthrough
    location /game.GameService/ {
        grpc_pass grpc://fw_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
    }

    # Everything else → Express static serving
    location / {
        proxy_pass http://fw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    # Client max body size for score/data submissions
    client_max_body_size 1m;
}
