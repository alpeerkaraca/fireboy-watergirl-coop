syntax = "proto3";

package game;

service GameService {
  rpc SubmitScore(ScoreRequest) returns (ScoreResponse);
  rpc GetLeaderboard(LeaderboardRequest) returns (LeaderboardResponse);
  rpc GetStageTime(StageTimeRequest) returns (StageTimeResponse);
  rpc AuthenticateUser(AuthRequest) returns (AuthResponse);
  rpc VerifyToken(VerifyRequest) returns (VerifyResponse);
}

message ScoreRequest {
  string user_id = 1;
  int32 stage_id = 2;
  int32 score = 3;
  int32 time_ms = 4;
}

message ScoreResponse {
  bool success = 1;
  int32 rank = 2;
  int32 total_players = 3;
}

message LeaderboardRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message LeaderboardEntry {
  string username = 1;
  int32 total_score = 2;
  int32 total_time_ms = 3;
  int32 stages_completed = 4;
}

message LeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  int32 total = 2;
}

message StageTimeRequest {
  string user_id = 1;
  int32 stage_id = 2;
}

message StageTimeResponse {
  int32 best_time_ms = 1;
  int32 rank = 2;
  int32 total_players = 3;
}

message AuthRequest {
  string email = 1;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
}

message VerifyRequest {
  string token = 1;
}

message VerifyResponse {
  bool success = 1;
  string token_jwt = 2;
  string user_id = 3;
  string username = 4;
}
